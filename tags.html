---
layout: default
title: 태그
permalink: /tags.html
---
<div class="container">
  <div class="row mt-3">
    <div class="col-md-8 main-loop">

      {% assign sorted_tags = site.tags | sort %}
      {% for tag in sorted_tags %}
        <div id="{{ tag[0] | downcase }}" class="mb-5 tag-section">
          <h4 class="font-weight-bold spanborder"><span># {{ tag[0] }}</span></h4>
          {% for post in tag[1] %}
            {% include main-loop-card.html %}
          {% endfor %}
        </div>
      {% endfor %}

    </div>
    <div class="col-md-4">
      {% include sidebar-featured.html %}
    </div>
  </div>
</div>
