# Site
name: 'Samantha Writer'
title: 'Samantha Writer'
description: '11년차 글쟁이 사만다의 블로그. 경제지와 뉴미디어에서 기자로, IT 기업에서 콘텐츠 라이터로 일하며 써온 글들.'
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
baseurl: ''
url: 'https://samantha-writer.github.io'
google_analytics: 'G-62G444T2KR'
disqus: 'http-samantha-writer-github-io'

include: ["_pages"]
permalink: /blog/:title

# Authors
authors:
  samantha:
    name: Samantha
    display_name: Samantha Lee
    avatar: 'assets/images/samantha_avator.jpg'
    gravatar: b1cc14991db7a456fcd761680bbc8f81
    email: samantha.writer89@gmail.com
    web: https://samantha-writer.github.io
    instagram: https://www.instagram.com/samantha.writer
    description: "11년차 글쟁이다. 경제지와 뉴미디어에서 기자로, IT 기업에서 인공지능 콘텐츠 라이터로 일했다. 자비스앤빌런즈에서는 브랜드 저널리스트로 시작해, 지금은 삼쩜삼 리서치랩에서 조세 정책에 관한 글을 쓰고 있다."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives

# Pagination
paginate: 6
paginate_path: /page:num/

# Other
markdown: kramdown

# Adsense
adsense: "disabled"

# Lazy Images
lazyimages: "enabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock, vendor, .bundle, .backups]

# Jekyll Archives
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: archive
  permalinks:
    category: '/category/:name/'
    tag: '/tag/:name/'
